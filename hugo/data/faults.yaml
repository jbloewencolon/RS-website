# "The fault list" on BehindTheScenes.dc.html — known and unfixed,
# published rather than quietly carried. See BehindTheScenes.dc.html's
# own intro copy for why these are shown at all.
#
# Retired: fault 04, "The pages need a runtime to draw" — resolved
# 2026-08-07 when Archive (the last reading page) migrated to Hugo.
# See the changelog for the was/now entry; removed here rather than
# kept and marked resolved, and the remaining faults renumbered, since
# this list's job is to state current problems, not carry history —
# that's the changelog's job, and it still has the record.
#
# Retired 2026-08-11, remaining faults renumbered again:
#   - "The archive notes are unreviewed" — removed at the site author's
#     direction.
#   - "The layout still parcels space" — named two things: the archive's
#     "Held in common" section, and the Invitation/Manifesto pairing. The
#     first is gone (moved to docs/parked/two-row-wampum/, off the live
#     site); rather than reword the fault down to the second alone, the
#     site author chose to retire it outright.
#   - "The contribution note goes nowhere yet" — resolved: the note field
#     on Contribute now opens a pre-filled email to the project's inbox
#     instead of a field nothing reads. See contribute/index.html.
- n: "01"
  title: "The server has no declared territory yet"
  body: "The site is hosted — GitHub Pages, live at this domain — but the most material fields in the colophon (server location, watershed) are blank for a different reason than this fault used to say: not because nothing exists yet, but because the current host doesn't disclose which facility it uses. Naming the actual machine's location and watershed, on a host that can name them, is a launch condition this project has not met, not an optional extra."
- n: "02"
  title: "Protocol-gated access is not built"
  body: "Opacity is currently expressed as a crawler policy and as honest absence. Community-defined access rules — the Mukurtu and TK Label model — are not implemented, so no material that genuinely needs protocol is held here yet."
- n: "03"
  title: "There is no community, so governance is a promise"
  body: "An editorial charter, advisory group, and appeals process are described in the future tense on the Contribute page. Until people exist to hold them, they are intentions, and this site says so rather than implying otherwise."
- n: "04"
  title: "No clickjacking protection"
  body: "The CSP is delivered as a <meta> tag because the current host cannot set response headers — and frame-ancestors, the directive that would stop this site being framed inside someone else's page, is one of a small number the CSP specification refuses to honour outside a real header, on any browser, no matter how it's written. There is currently no way to close this gap without changing host. Same root cause as fault 01."
- n: "05"
  title: "The confirm link carries more than it should"
  body: "Signing up sends a link containing the chosen name and interests, signed to prove it came from this site but not encrypted — readable by anything the link passes through on its way to being clicked: mail-provider logs, link-scanning security products, the transactional-email service's own logs. The subscriber store itself keeps interests aggregate-only and never attached to an address, by design; this link defeats that property everywhere outside the store file for the roughly 48 hours before it's clicked or expires. Fix in progress: move the pending signup into short-lived server-side storage and put only an opaque, meaningless id in the link itself."
