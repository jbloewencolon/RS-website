# "The fault list" on BehindTheScenes.dc.html — known and unfixed,
# published rather than quietly carried. See BehindTheScenes.dc.html's
# own intro copy for why these are shown at all.
- n: "01"
  title: "The server has no declared territory yet"
  body: "The site is unhosted, so the most material field in the colophon is blank. Naming the machine's location and watershed is a launch condition, not an optional extra."
- n: "02"
  title: "Protocol-gated access is not built"
  body: "Opacity is currently expressed as a crawler policy and as honest absence. Community-defined access rules — the Mukurtu and TK Label model — are not implemented, so no material that genuinely needs protocol is held here yet."
- n: "03"
  title: "The archive notes are unreviewed"
  body: "Every source note, nation attribution, and reuse line was written by one person and is awaiting paid Indigenous review. Errors are likely. Corrections will appear in the log, struck rather than erased."
- n: "04"
  title: "The pages need a runtime to draw"
  body: "Plain semantic markup with no build step is the durability, accessibility, and sovereignty choice all at once. This build partially meets it: Manifesto, Learn, and this page now render and read fully with scripting off, generated by Hugo from data files and committed as plain HTML (see the Build field above). Archive does not yet — turn off scripting and it still doesn't render. Practise keeps the runtime regardless; it is a tool, not a reading page."
- n: "05"
  title: "The layout still parcels space"
  body: "One section of the archive now expresses shared jurisdiction — two themes claiming the same texts in the same cells. The rest of the site is a conventional grid of exclusive parcels. Whether that matters more than legibility is an open question, not a settled one."
- n: "06"
  title: "There is no community, so governance is a promise"
  body: "An editorial charter, advisory group, and appeals process are described in the future tense on the Contribute page. Until people exist to hold them, they are intentions, and this site says so rather than implying otherwise."
