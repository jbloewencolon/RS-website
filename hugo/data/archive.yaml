trackB:
  - "Tronto — Caring Democracy"
  - "Kittay — Love's Labor"
  - "Brake — Minimizing Marriage"
  - "Stark — Coercive Control"
  - "Dixon & Piepzna-Samarasinha — Beyond Survival"

shared:
  - title: "It's About All Relations"
    by: "Rauna Kuokkanen — Indigenous feminist relational freedom is a sovereignty argument and a care argument in the same sentence, and refuses to be filed as either."
  - title: "Caretaking Relations, Not American Dreaming"
    by: "Kim TallBear — caretaking is kinship obligation and land relation at once; splitting them produces the settler version of both."
  - title: "Care Work: Dreaming Disability Justice"
    by: "Leah Lakshmi Piepzna-Samarasinha — collective access as self-determination; the care webs are also a politics of refusal."
  - title: "Access Intimacy: The Missing Link"
    by: "Mia Mingus — support that does not create ownership. Belongs equally to the ethics of care and to the refusal of possession."

sequence:
  - "Wildcat — Replacing Exclusive Sovereignty"
  - "Kuokkanen — It's About All Relations"
  - "TallBear — Caretaking Relations, Not American Dreaming"
  - "Tuck and Yang — Decolonization Is Not a Metaphor"
  - "Spillers — Mama's Baby, Papa's Maybe"
  - "Stanford Encyclopedia — Feminist Perspectives on Autonomy"
  - "Mingus — Access Intimacy"
  - "Malatino — Trans Care"
  - "Stark — Coercive Control"
  - "Creative Interventions — Toolkit"

