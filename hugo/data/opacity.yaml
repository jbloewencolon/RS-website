# "Principle 08, applied to this website" section on Learn.dc.html.
- state: "real, one line of config"
  what: "The crawler is refused, selectively"
  why: "The workshop and the contribution pages are disallowed in robots.txt. Discovery by a third party is not a condition of existing, and a publisher can decline the register."
  color: "#509C64"
- state: "real, by having nothing"
  what: "There is no consent banner"
  why: "Not because consent was waived, but because nothing is tracked, no cookie is set, and nothing is stored. The strongest refusal of consent theatre is having nothing to recite at you."
  color: "#509C64"
- state: "real, as absence"
  what: "Some things are simply not here"
  why: "No intimate data is collected because it is technically possible. The tools keep their answers in your browser. An archive record can exist while its content does not. Absence is not incompleteness."
  color: "#509C64"
- state: "not built"
  what: "Community-set access rules"
  why: "Protocol-gated material, where a community rather than this project decides who may see what, is unimplemented. Until it is, nothing that genuinely requires protocol is held here."
  color: "#DB9E2A"
