# "The substrate" table on BehindTheScenes.dc.html.
- k: "Server location"
  v: "Not yet known — the site is unhosted at v0.2. Before launch this field states the city, the operator, and whose territory the machine sits on."
  rule: "#8B3A2F"
- k: "Watershed"
  v: "Not yet known. The data centre cooling a site is drawn from someone's water; that water has a name."
  rule: "#8B3A2F"
- k: "Page weight"
  v: "Under 60 KB per page, uncompressed, including all markup and logic. No images, no icon fonts, no video."
  rule: "#366943"
- k: "Third-party requests"
  v: "Zero. No fonts, analytics, embeds, tag managers, CDNs, or ad tech. Nothing on this site phones anywhere."
  rule: "#366943"
- k: "Cookies and storage"
  v: "None set. Nothing is written to your device, so nothing needs consenting to and there is no banner to recite at you."
  rule: "#366943"
- k: "What is logged"
  v: "Whatever the eventual host logs by default, which will be reduced as far as the host allows and stated here plainly."
  rule: "#7D5915"
- k: "Build"
  v: "Partial, in progress. Manifesto, Learn, and this page are generated from plain data files into plain HTML by Hugo (a single static binary, no dependency tree) — the output is committed and is what ships: no runtime, no framework, opens offline from a saved file. The generator exists for whoever maintains this, not for whoever reads it. Archive is the one reading page not migrated yet, still hand-written against the runtime described below."
  rule: "#7D5915"
- k: "Durability"
  v: "Partial. Manifesto, Learn, and this page now meet the standard of markup that will still render in twenty years. Archive still needs a small runtime to draw. Fault 4 below."
  rule: "#7D5915"
