# "The substrate" table on BehindTheScenes.dc.html.
- k: "Server location"
  v: "Not yet known — the site is unhosted at v0.2. Before launch this field states the city, the operator, and whose territory the machine sits on."
  rule: "#8B3A2F"
- k: "Watershed"
  v: "Not yet known. The data centre cooling a site is drawn from someone's water; that water has a name."
  rule: "#8B3A2F"
- k: "Page weight"
  v: "Under 60 KB per page, uncompressed, including all markup and logic. No images, no icon fonts, no video."
  rule: "#366943"
- k: "Third-party requests"
  v: "Zero. No fonts, analytics, embeds, tag managers, CDNs, or ad tech. Nothing on this site phones anywhere."
  rule: "#366943"
- k: "Cookies and storage"
  v: "None set. Nothing is written to your device, so nothing needs consenting to and there is no banner to recite at you."
  rule: "#366943"
- k: "Security headers"
  v: "A Content-Security-Policy on every page, machine-checked in CI (a build fails if any page loads a script, stylesheet, or CSS import/url() from off this domain — outbound prose links are exempt on purpose, that's citation, not a subresource load). Each page's policy is only as permissive as that specific page needs: the four reading pages allow no script execution beyond their own same-origin file, Practise/Home/Contribute need a narrow eval allowance for the page-template runtime they still run on, and only Home and Contribute's connect-src includes the dispatch Worker's origin. Delivered as a <meta> tag, not a response header, because GitHub Pages — this site's current host — cannot set response headers. That has one real consequence: frame-ancestors (clickjacking protection) cannot be delivered via <meta> at all, by the CSP specification itself, so this site currently has none. Fault below."
  rule: "#7D5915"
- k: "What is logged"
  v: "Whatever the eventual host logs by default, which will be reduced as far as the host allows and stated here plainly."
  rule: "#7D5915"
- k: "Build"
  v: "Every reading page — Manifesto, Learn, Archive, this page — is generated from plain data files into plain HTML by Hugo (a single static binary, no dependency tree): the output is committed and is what ships, no runtime, no framework, opens offline from a saved file. The generator exists for whoever maintains this, not for whoever reads it. Practise keeps a small runtime, because it is a tool rather than something to read — its filter-by-tag convenience on Archive is the one piece of client-side JavaScript left on a reading page, and it is a plain progressive enhancement: every entry renders regardless, the script only ever narrows what is already there."
  rule: "#366943"
- k: "Durability"
  v: "Met, for the reading pages — all four now render and read fully with scripting off, not asserted but verified against a real headless browser with JavaScript disabled. Practise is the one page that still needs its runtime, deliberately: it is interactive by nature, not a reading page."
  rule: "#366943"
