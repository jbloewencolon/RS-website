# "The substrate" table on BehindTheScenes.dc.html.
- k: "Server location"
  v: "Hosted on GitHub Pages (GitHub, Inc.), this project's actual current host, not a future plan; see the security-headers row below for why that matters. GitHub does not publish which physical data centre or region serves a given Pages deployment, so the city, operator, and territory this field is meant to name are genuinely unstated, not merely undocumented. Moving to a host that discloses this is what RS-022/FLAG-02 would resolve."
  rule: "#8B3A2F"
- k: "Watershed"
  v: "Not statable for the same reason as server location: the current host doesn't disclose which facility serves this site, so there is no watershed to name yet, not because nobody looked, but because the information isn't published anywhere to find."
  rule: "#8B3A2F"
- k: "Page weight"
  v: "Ranges from about 21 KB (the Invitation) to about 137 KB (the Archive) per page, uncompressed HTML: no images, no icon fonts, no video. Three pages (Home, Practise, Contribute) additionally load a shared ~70 KB script once per browser session, cached rather than re-downloaded on every page view. This figure has drifted stale twice before: first a flat \"under 60 KB\" claim outgrown by the site's own content, then a range that drifted 10+ KB out of date as pages kept changing after it was written. It is now checked in the build's own test suite (checkPageWeight in scripts/check-pages.mjs) against every shipped file's actual size, so a future edit that moves this number without updating the words here fails the build instead of quietly becoming untrue a third time. It rose by about 2 KB per page in August 2026, when the CSS every page had been carrying its own copy of was extracted into one shared block: that block now also holds a set of control styles the pages have not yet been switched over to, so for the moment each page ships a little more than it uses. Switching them over removes the per-element styling those replace. A further ~1 KB per page went into the same shared block in August 2026 for the botanical layer's stroke, growth and print rules; no page draws anything with them yet, and the layer adds no request to any page. The Archive figure rose again in August 2026 with two additions: the groups became pockets with their own hero grid (AR-05/06/07), and the botanical layer shipped (BM-06) — together these account for the rise from 131 KB to 137 KB."
  rule: "#6B4C12"
- k: "Third-party requests"
  v: "Zero, with two deliberate, disclosed exceptions, both on Home and Contribute only. First: submitting the dispatch signup form sends the address you typed to the Worker described below. Second: both forms load Cloudflare's Turnstile, a bot check that runs before the form will submit at all, added after an external security audit and an independent review both flagged the same gap: nothing stopped the signup endpoint from being used to send unwanted email to a stranger's address, repeatedly, from many machines at once. It's verified on the Worker itself, not just displayed, so a script can't skip it by forging success. No fonts, analytics, embeds, tag managers, or ad tech, on any page, and nothing on the other five pages phones anywhere at all."
  rule: "#366943"
- k: "Mailing-list processor"
  v: "A Cloudflare Worker (self-operated, not a third-party mailing-list platform) is the one piece of this site's infrastructure that isn't purely static. It receives the two signup forms (Home, Contribute), sends the confirmation and unsubscribe emails, and writes the encrypted subscriber file. Source: worker/ in this repository."
  rule: "#366943"
- k: "Transactional email"
  v: "Sent through Resend's API: confirmation and unsubscribe messages only, plain text, no tracking pixel, no click-tracking redirect. Resend receives an address and the text of that one message; it never receives the interests picked at signup, is never handed the subscriber list, and is never used to send anything else."
  rule: "#366943"
- k: "Where the list lives"
  v: "A private, operator-controlled GitHub repository, separate from this public one, holding a single file encrypted with AES-256-GCM. The decryption key exists only as a Cloudflare Worker secret; it is never written to any repository, public or private. That file, taken on its own, decrypts to nothing."
  rule: "#366943"
- k: "What's actually stored"
  v: "Per subscriber: the address they confirmed and the time they confirmed it. What they were interested in (the zine, the reading circle, a workshop) is recorded only as a site-wide count, never attached to an address. A leaked or subpoenaed copy of the file can say how many people want what; it cannot say who. The confirmation link itself used to undercut this: it carried the chosen name and interests in a signed but unencrypted token, readable by anything the link passed through before it was clicked. As of 2026-08-11 the link carries only a meaningless random id; the actual signup details live in short-lived storage the link points to, not in the link itself. Removing someone updates this file; the encrypted version of it from before they left still exists in this repository's own git history, unless that history is deliberately rewritten. See the fault list."
  rule: "#366943"
- k: "Cookies and storage"
  v: "None set. Nothing is written to your device, so nothing needs consenting to and there is no banner to recite at you."
  rule: "#366943"
- k: "Security headers"
  v: "A Content-Security-Policy on every page, machine-checked in CI (a build fails if any page loads a script, stylesheet, or CSS import/url() from off this domain; outbound prose links are exempt on purpose, that's citation, not a subresource load). Each page's policy is only as permissive as that specific page needs: the four reading pages allow no script execution beyond their own same-origin file, Practise/Home/Contribute need a narrow eval allowance for the page-template runtime they still run on, and only Home and Contribute's script-src/connect-src/frame-src additionally name the dispatch Worker and Cloudflare Turnstile, the one third-party addition either page carries, and only those two. Delivered as a <meta> tag, not a response header, because GitHub Pages, this site's current host, cannot set response headers. That has one real consequence: frame-ancestors (clickjacking protection) cannot be delivered via <meta> at all, by the CSP specification itself, so this site currently has none. Fault below."
  rule: "#6B4C12"
- k: "What is logged"
  v: "Whatever GitHub Pages, this project's current host, logs by default, not yet audited or reduced, and not yet stated here in specific terms. This project inherited a host before confirming its logging practices meet the minimisation this page states as a goal, which is backwards, and this row says so rather than implying the sequencing went the other way."
  rule: "#6B4C12"
- k: "Build"
  v: "Every reading page (Manifesto, Invitation, Learn, Archive, Resources, this page) is generated from plain data files into plain HTML by Hugo (a single static binary, no dependency tree): the output is committed and is what ships, no runtime, no framework, opens offline from a saved file. The generator exists for whoever maintains this, not for whoever reads it. Home, Practise, and Contribute keep the dc-runtime instead, since each carries live interactive logic (forms, a stateful tool) Hugo's static output can't hold. Archive keeps one small script of its own, archive-filter.js, for its filter-by-tag convenience, the one piece of client-side JavaScript on a Hugo-generated page, and a plain progressive enhancement: every entry renders regardless, the script only ever narrows what is already there."
  rule: "#366943"
- k: "Durability"
  v: "Met, for the reading pages: all four now render and read fully with scripting off, not asserted but verified against a real headless browser with JavaScript disabled. Practise is the one page that still needs its runtime, deliberately: it is interactive by nature, not a reading page."
  rule: "#366943"
