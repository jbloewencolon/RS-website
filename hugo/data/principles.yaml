# The twelve principles shown on Learn.dc.html. Single source of truth —
# edit here, then `npm run build:hugo` regenerates the page.
- n: "01"
  title: "No ownership"
  body: "People do not become property through romance, marriage, sexuality, family, caregiving, or shared history."
  question: "What access am I treating as an entitlement?"
- n: "02"
  title: "Self-determination"
  body: "Each person should retain meaningful authority over their body, identity, beliefs, associations, and life direction."
  question: "Which decisions belong primarily to me, and which genuinely require shared governance?"
- n: "03"
  title: "Chosen interdependence"
  body: "Needing people does not eliminate sovereignty. The problem is not dependence but dependence controlled by someone else."
  question: "Do I have meaningful influence over the conditions under which I receive or provide care?"
- n: "04"
  title: "Consent"
  body: "Consent must be specific, informed, ongoing, and materially possible. A label is not blanket permission."
  question: "What would happen if someone said no?"
- n: "05"
  title: "Non-domination"
  body: "Power should not be arbitrary, hidden, or impossible to challenge. Difference is real; domination is not inevitable."
  question: "Who controls the resources, information, recognition, or access in this relationship?"
- n: "06"
  title: "Relational accountability"
  body: "Freedom does not remove responsibility for foreseeable effects on others."
  question: "Who bears the cost of my choices?"
- n: "07"
  title: "Refusal"
  body: "A relationship should contain space for disagreement, boundaries, withdrawal, and change."
  question: "Can refusal occur without retaliation?"
- n: "08"
  title: "Opacity"
  body: "Intimacy does not require complete access or total legibility."
  question: "What parts of another person am I assuming I have a right to know?"
- n: "09"
  title: "Reciprocity"
  body: "Relationships involve giving and receiving, but reciprocity does not require identical contributions."
  question: "Are care, effort, risk, and benefit distributed in a way people experience as fair?"
- n: "10"
  title: "Repair"
  body: "Accountability requires more than apology. Repair does not guarantee reconciliation."
  question: "What material or behavioural change would repair require?"
- n: "11"
  title: "Transformation"
  body: "Relationships may change form without becoming meaningless."
  question: "Are we preserving the relationship, or merely preserving its current category?"
- n: "12"
  title: "Relational futurity"
  body: "The purpose is not simply to reject harmful relationships, but to create forms of connection in which people and communities can flourish."
  question: "What kind of relational world are our present practices creating?"
