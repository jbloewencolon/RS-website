# Change log on BehindTheScenes.dc.html — append-only, per the page's own
# stated practice ("Corrections are shown, not overwritten"). Add new
# entries to the top version block; do not edit or remove past ones, even
# when a later entry updates what an earlier one said (e.g. an entry
# noting a page "has not migrated yet" stays as written once a later
# entry documents that migration — that's the log doing its job, not an
# error to fix).
- version: "v0.2 — current"
  entries:
    - was: "thesis 11 — \"relationships are not private empires... children, friends, communities, care networks, and land absorb the consequences\" — argued a relationship must answer for its effects on others, without ever saying who has standing to demand that answer. Read carelessly, it supplies a rationale for exactly the surveillance already aimed at poor, disabled, queer, and Black families — the demand that a household explain itself to a state or a hostile public, dressed in this framework's own language"
      now: "thesis 11 keeps its claim and adds the missing line: \"standing to demand that account belongs to the people who absorb the consequences — not the state, not a crowd with an opinion. Collapse that distinction and this thesis becomes a rationale for the surveillance already aimed at the families it should be protecting.\" The closing line changes to match: \"No private freedom built on public damage — and only the people who absorb it get to ask\""
    - was: "thesis 02's closing line — \"no rule is sacred just because it is old\" — coded tradition itself as presumptively unfree, with age as the implicit test. That quietly privileges the self-authorizing individual as the free position and treats inherited, genealogical, or ceremonial forms of relationship as constraint by default — the same move settler discourse has long used to call Indigenous and other genealogically-organized societies unfree for being genealogical, exactly the kind of move this framework argues against everywhere else"
      now: "thesis 02 keeps its core refusal — the preassembled defaults, tradition mistaken for consent — and adds the missing distinction: a relationship chosen inside inherited law, kinship, or ceremony is not less free than one built from nothing, and insisting the self-authoring individual is the only free shape has \"its own colonial history.\" The closing line changes from an age test to the same accountability test the rest of the thesis already uses: not how old the rule is, whether it can answer for itself"
    - was: "Home's four stated limits explained what this framework isn't without ever naming that chosen monogamy is one of the things it protects — a site built partly out of a critique of amatonormativity had no line saying non-monogamy isn't the more evolved choice, and no name for pressure running the other direction, toward opening a relationship someone didn't want opened"
      now: "a new paragraph beside the four limits, not folded into any one of them: chosen monogamy named directly as protected on the same terms as any other form, and coercive non-monogamy named as what isn't protected — pressure, guilt, or being worn down into opening up, sometimes in this site's own vocabulary"
    - was: "the archive had thirteen groups of what to refuse, revise, or hold accountable, and nothing for why any of it is worth doing — no erotics in a framework about intimacy, and a Black feminist presence still thin even after this session's earlier additions"
      now: "a fourteenth and final group, \"Love, eros, and why any of this is worth doing\": Audre Lorde's Uses of the Erotic, bell hooks' All About Love, adrienne maree brown's Pleasure Activism, Kai Cheng Thom's I Hope We Choose Love, and Prentis Hemphill's What It Takes to Heal — the last moved here from an earlier, thinner plan to pair it alone with Menakem, on the reasoning that five entries in one live group beats two half-built ones. Distinct from the property-and-kinship genealogy earlier in the archive: two different holes, both real"
    - was: "the framework had no tool for endings — the Consent Domains Map assumes an ongoing relationship, and \"Exit & Transition Plan\" sat on the not-yet-built list for eight months of roadmap language while nothing addressed the actual logistics of leaving, what's owed on the way out, or the grief that follows either"
      now: "a second tool on Practise, gated by its own safety card at the top rather than the bottom (\"if leaving safely means leaving suddenly — close this and go\"): a care-continuity audit (money, medication, the school run, paperwork, the lease, immigration status, a pet, a phone plan — who holds each after, and do they know), the Invitation's \"On goodbyes\" reproduced in full, and a closing section with no fields, no prompts, and nothing that counts as finished. One build, not three — the same object the Repair Protocol's still-unbuilt step 2 and the already-shipped continuity-of-care clause in Learn both point at, built once here rather than duplicated later"
    - was: "this site's own vocabulary — \"boundary,\" \"capacity,\" \"sovereignty,\" and the rest — was published with no acknowledgment that every one of those words is exactly as usable to avoid accountability as it is to name what needs it. And, found while building the fix: the manifesto's \"Print this manifesto\" button had been silently non-functional since it shipped — an inline onclick, blocked by this site's own script-src CSP, doing nothing when clicked, with no error visible to a reader"
      now: "a new Learn section, \"How this vocabulary gets used as a weapon\" (`#field-guide`), naming ten phrases this site's own words make available — including its own \"I'm honouring my sovereignty\" — each with the diagnostic question worth asking when one lands on you. Linked from Practise's safety gate, from Resources' coercive-control listing, and from the Invitation's own closing section, naming plainly that its own warmth is exactly this kind of language too. Printable on its own, isolated from the rest of Learn, via a new button. Fixed alongside it: print.js, a same-origin script every print button on the site now uses instead of an inline handler, so \"Print this manifesto\" and \"Print this invitation\" actually fire for the first time under this site's own CSP, not just visually"
    - was: "the site said a great deal about what relational sovereignty is and nothing about how to raise it with someone who hasn't read any of it — a reader convinced by the manifesto had no guidance for the actual, awkward moment of bringing this up with a partner, and no warning that the same vocabulary that names coercion can also be used to apply it"
      now: "a \"Before you bring this up with someone\" disclosure on Practise, next to the existing safety and grounding sequence rather than gating it — five concrete suggestions, then the one paragraph that isn't optional: if this is being raised to get someone to agree to something they already declined, it isn't the tool for that, and putting it in this vocabulary makes it worse, not better"
    - was: "the roadmap named \"Relationship anarchy\" and \"Amatonormativity\" as topics with nothing written yet, and Learn never actually explained either term — a reader had to already know what relationship anarchy meant to notice the framework was building on it"
      now: "a new Learn section, \"Forms and labels, none of them the default,\" naming both terms plainly and linking each to its source on the archive shelf. Underneath: an alphabetical, unranked grid of eleven relationship-form labels — monogamy, polyamory, relationship anarchy, chosen family, and others — with a line stating outright that alphabetical order is the only order it carries, nothing here outranks anything else, and a person's own word for what they have governs even if it's not listed. A closing line holds the line the material-conditions constraint requires: naming these as equals doesn't make the legal, immigration, and custody risk of choosing one equal to another"
    - was: "the site had exactly one door, the manifesto, and one register — acid, declarative, thirteen theses and a refusal. Anyone the register itself repelled had nowhere else to start, and nothing on the site said anything about wanting to be here, what it feels like when this works, or what's owed when it ends"
      now: "a second page, the Invitation, running parallel to the manifesto rather than introducing it — \"two ways in, neither is the introduction to the other,\" the same two-vessels-one-river figure the archive already uses for its own shared shelf, applied a second time. It carries two pieces of new writing: \"An invitation,\" first person, on wanting someone's growth without owning it, ending on the same material floor every warm line on this site now has to clear; and \"On goodbyes,\" on what's owed at the end of something, closing with the line this whole addition exists to hold — if going safely means going suddenly, go. Home gains exactly one paragraph above its door grid, linking there; the primary nav on every page gains one link, next to the manifesto's"
    - was: "the archive named Coulthard's *Red Skin, White Masks* in the \"Held in common\" diagram since v0.2 and never actually shelved it, and eighteen other works the site's own citations depended on — sovereignty's own critics, a second genealogy of settler kinship and sexuality, the clinical basis for the safety gate, mutual aid and abolitionist practice, non-monogamy's own critics — sat as drafts, unlinked, in a planning document instead of on the page"
      now: "nineteen entries added across the existing shelves, each link independently verified against the publisher, journal DOI, or author's own site rather than trusted from the draft: Coulthard, Cohen, Kuokkanen/Lightfoot/Starblanket/Wildcat's 2025 sequel to the site's own foundational citation, Povinelli, Rifkin, Lugones, Kelly & Johnson, Feeney, Freeman, Spade, adrienne maree brown's *We Will Not Cancel Us*, Kaba, Noël, Rambukkana, and Borrows. No new filter facets added — every new entry fits the existing book/article/toolkit taxonomy without stretching it, so the filter bar stays as it was"
    - was: "the framework's one safety check — the five questions asked before the Consent Domains Map, and republished standalone on Resources — existed in only one register: full sentences with embedded clauses, excluding non-speaking, intermittently verbal, and cognitively fatigued readers from the exact check meant to protect them"
      now: "the same five questions, reworded to shorter sentences, sit behind a plain-HTML disclosure on both pages — no script, works identically with JavaScript on or off, since Resources carries zero script by design and this needed to match. The Consent Domains Map gains a line naming that consent is not always spoken: use the labels, or agree on signals of your own — a tap, a card, a gesture — with the tool holding none of those signals itself, since a physical protocol between two people isn't something a webpage should try to encode as an input method"
    - was: "the framework asked readers to notice what is happening in a relationship and offered no vocabulary for what happens in a body while they do it — and the archive's only Black theoretical presence was distant from the felt, somatic register thesis 07's own line about who absorbs the anger is written in"
      now: "a new archive group, \"Bodies, regulation, and what happens before words,\" opens with Resmaa Menakem's *My Grandmother's Hands* — racialised trauma carried somatically, read alongside thesis 07. Polyvagal theory, contested in the physiological literature, is left out entirely rather than shelved with a caveat, per Decision Record D13. A second planned entry for this group is being placed with a related new archive group instead of duplicated here — one group, not two thin ones"
    - was: "the manifesto had no thesis linking the dyad to collective struggle — fifteen theses about relationships, and nothing about the relationship between a household and a movement"
      now: "thesis 16, \"The house is not a rehearsal\": we will not build a world without police, borders, and extraction while running small versions of all three at home — not because the private is where politics begins, but because they are the same fight at different scales, and a movement that cannot survive its own kitchen will not survive anything else. Do both; neither is waiting for the other to finish. Sixteen theses and a refusal, updated everywhere the count was said out loud"
    - was: "the Contribute form's \"What you might offer\" field looked like a working way to leave a note — but nothing on the dispatch Worker ever read, stored, or forwarded it, so whatever anyone typed there was silently discarded. Submitting anything through the form required an email either way and always sent a \"confirm your subscription\" message, even to someone who only wanted to leave a note and never checked a single dispatch-interest box. Both error messages on this form and on Home pointed a failed submission to \"the address in the colophon\" — which does not exist; no email address is published anywhere on this site"
      now: "the field is relabelled \"Optional contribution note\" and says plainly, next to the warning about strangers reading it, that it isn't wired to anywhere yet — linking to a new fault (07) that names the gap precisely: an email is required for any submission today because the only backend behind this form is the mailing-list signup flow, and there is no separate channel yet for a note-only visitor. The note is now at least sent to the Worker rather than dropped before it leaves the browser, so wiring up real delivery later is a Worker-side change only. The dead colophon-address referenced in both forms' error text is gone, replaced with something that doesn't point at nothing"
    - was: "the Archive's filter for its most accessible entries was labelled \"★ start here,\" implying an order to a shelf the page's own kicker already called \"nothing ranked\" — the filter and the framing copy around it disagreed with each other"
      now: "\"★ a first route,\" with a line at the filter bar saying plainly what that means: a suggested way in, not a ranking — everything else on the shelf carries the same weight, not runner-up status. The filter still narrows nothing without a click, the full archive still renders unfiltered by default, and scripting off still shows every entry — only the label and its framing changed, not the mechanism"
    - was: "the Consent Domains Map's save/resume controls (export warning, filename field, save button, resume-from-file) sat permanently open beneath the print and clear buttons, adding four elements' worth of visual weight to a toolbar most visits never need"
      now: "those controls live inside a native disclosure, \"Save or resume this map\" — closed by default, opened with a click or a keypress, no script required to toggle it. The complete findability warning still sits directly above the export button every time the section is open, in exactly the same words, not summarised or deferred to a second click. Print and Clear stay exactly where they were, outside the disclosure, needing no extra interaction. Nothing about what's saved, how, or the no-localStorage guarantee changed — only how much of the page shows by default"
    - was: "Behind the Scenes carried eight sections — substrate, type, crawler policy, reuse terms, faults, roadmap, change log, labour and money — in a single unbroken scroll with no way to jump to one directly"
      now: "a contents menu at the top of the page, eight ordinary same-page anchor links. The fault list stays exactly as visible as it always was — the menu is a way in, not a way to fold anything out of sight, and current faults were never going to be the thing this page made harder to find"
    - was: "Learn ended with a nineteen-card grid of topic names, none linked, most not even drafted — the single largest block on the page was the part that didn't exist yet, outweighing the thirteen principles actually written above it"
      now: "a two-sentence explanation and a link to a new Roadmap section on the colophon, which carries the full nineteen-topic list (six drafted, thirteen not yet written) instead. Learn is now weighted toward what's actually on it; the honest disclosure that more is planned didn't need to be the biggest thing on the page to still be told plainly"
    - was: "Resources listed eleven categories in page order with no way to jump straight to the one a reader needed — crisis lines first, Indigenous-led services near the bottom, nothing in between named until scrolled to"
      now: "a \"Choose what you need\" list of same-page anchor links, placed after the immediate-safety questions rather than before them — a reader in danger sees those first, not a menu. Ordinary anchors only: no geolocation, no questionnaire, no filtering, no storage of what anyone clicked. Every urgent line on the page stays exactly where it was"
    - was: "the Consent Domains Map's two section headings — \"The seventeen domains\" and \"Access Intimacy & Body Support\" — never stated that they add to twenty, leaving a reader to do the arithmetic against the page's own meta description instead of being told"
      now: "\"Seventeen general consent domains\" and \"Three care and access domains: Access Intimacy & Body Support\" — the split and the total are both explicit in the headings themselves, and the Access Intimacy name (Mia Mingus's term, tied to principle 13) stays rather than being replaced outright"
    - was: "the site used \"sovereignty\" in at least four different senses — political, jurisdictional, relational, rhetorical — without ever marking which one was doing the work in a given sentence, and never engaged the strongest objection to using the word at all"
      now: "a new Learn section names all four senses and says plainly that the political and relational ones are not the same kind of thing, even where the site's own persuasiveness leans on them rhyming. A closing paragraph names Taiaiake Alfred's argument that sovereignty is inseparable from the frameworks of colonisation as an objection this site has not answered, not a settled question — and that argument is genuinely on the shelf now, not just referenced: Joanne Barker's edited collection carrying Alfred's chapter joined the archive alongside it, so the claim has something real to point to. The reading-ten list changes for the first time since v0.1: a heavy edited collection is out in favour of the free encyclopedia entry already on the shelf that covers the same ground; amatonormativity and relationship anarchy step aside, being the part of this framework people get wrong the least, for the second genealogy of possession and compelled legibility. Six of the ten are now free to read, worth saying outright rather than leaving a reader to notice"
    - was: "thesis 01 derived possession from a single road — settler colonialism enclosing land, then bodies, then the home — and the archive held no Black feminist theory of kinship and property, for a manifesto whose first thesis is about the grammar of possession"
      now: "thesis 01 names a second road into that grammar: chattel slavery made the person property directly and made kinship legally void, a different mechanism with a different afterlife, still shaping which households are permitted a closed door. Neither genealogy stands in for the other. A new archive group, \"Possession, the person, and kinship made void,\" carries Spillers, Hartman, Roberts, and Bridges. Two more named entries — Patterson and Collins — are held back: the source material specifying which of their books belongs here has a gap neither this session nor the site's own planning docs can responsibly guess at, so the group ships with four names rather than a placeholder for six"
    - was: "principle 08 (Opacity) said intimacy does not require total legibility, with no distinction between a person choosing not to be fully known and a person being compelled to disclose themselves to a clinician, court, employer, insurer, or border agent to receive care, money, status, or documents — a difference the archive had no trans scholarship to name"
      now: "principle 08 states the limit: opacity is a right against people who want more of you than they are owed, not against institutions that compel disclosure — refusing to be read is a privilege unevenly distributed, and the framework should not mistake one for the other. A second question asks where a person is already required to be legible to someone with power over them. Trans Care by Hil Malatino joins the archive — open access, and read for what it argues is the most developed live practice of what this site theorises, not as a stand-in for trans people's own account of their own care"
    - was: "the Consent Domains Map had to be completed in one sitting or lost entirely — no way to save progress and come back, which is a stamina requirement the framework has no reason to impose"
      now: "a file-based save and resume: export writes a plain JSON file, nothing auto-saves and nothing is written to the device silently, and a non-dismissible notice sits directly above the export button because a saved file is a discoverable object in a way in-browser state isn't — printouts and download-history entries can be found by someone else, and the warning says so before the file exists, not after. Resuming works only by re-importing a file you chose to keep; there is no localStorage, so the same risk never exists without the same warning. Filenames are neutral by default and yours to change. The Consent Domains Map now also names the concept behind not requiring one sitting — crip time, Alison Kafer's term — and the archive carries both her book and Ellen Samuels' essay on it, rather than using the phrase without saying where it came from"
    - was: "the glyph check compared advance widths against the .notdef box — a method that cannot detect a missing glyph in a monospace face at all, since every character in a true monospace font shares one fixed advance width whether it's present or not. The x̂ (Unangax̂) combining character, which renders live in that exact stack on Archive's by-lines, was flagged \"at-risk\" because the check itself couldn't give a real answer, not because anyone had confirmed a problem"
      now: "the check compares actual rendered pixels against the .notdef glyph instead, which works for any font. Re-run this session on the one platform available to test it (Chrome / Linux): every character in all three font stacks, including x̂, is confirmed present, not assumed. Windows, macOS, iOS, and Android — and Safari, Firefox, and Edge — remain unverified and are named as a known gap rather than left implied"
    - was: "\"every archive entry links to the author, publisher, or open-access source\" — true of the destination domain, not always true of the page: roughly twenty entries linked to a publisher's homepage rather than the specific book or article, and two entries had no link at all"
      now: "every one of the 31 entries checked individually and, where possible, repointed to the actual work: a specific book page, a specific article page, or a DOI. Two entries that previously had no link recorded now do — one turned out to be genuinely open access where nobody had checked before. One paywalled mirror (a Wiley reprint of an article the journal itself publishes open access) was replaced with the journal's own free copy. Nothing was guessed: every replacement was fetched and its title and author confirmed before it went in"
    - was: "the dispatch signup forms said an address is \"never given to a third party\" and \"no third parties\" with no further detail, while a live Cloudflare Worker, a Resend transactional-email account, and a private GitHub repository were all already part of how a signup actually gets processed"
      now: "the substrate table names all three: the Worker as the self-operated processor, Resend's role limited to sending the confirmation and unsubscribe emails (never handed the list, never told what someone was interested in), and the encrypted file's home in a private repository this one doesn't touch, keyed by a secret that is never written to any repository at all. The dispatch copy on Home and Contribute now points to that disclosure instead of asserting no processor exists"
    - was: "thesis 14 titled \"Survivance, not 'no future'\", using a Nation-specific concept for injuries it was not written about"
      now: "the term removed until there is paid review that could say whether the extension holds. The archive still carries Vizenor. The debt was real; the borrowing was not ours to make"
    - was: "three faces loaded from a font CDN on every page"
      now: "system font stack, zero third-party requests, reader addresses disclosed to nobody"
    - was: "orthographic coverage assumed"
      now: "every diacritic on the site measured against the notdef box, check published and re-runnable"
    - was: "opacity demonstrated as a reveal button"
      now: "a real crawler policy, an honest account of what is not built, and the existing protocol tools named"
    - was: "34-pixel colour-only swatches in the Consent Domains Map"
      now: "labelled radio controls, 44-pixel targets, colour never the only signal"
    - was: "'points outward' with no outbound links"
      now: "every archive entry links to the author, publisher, or open-access source"
    - was: "no colophon, no changelog, no reuse terms, no crawler file"
      now: "this page, plus robots.txt"
    - was: "'not a substitute for decolonization' as the only limit"
      now: "the limit stated plainly — a website returns no land; this is anti-colonial design"
    - was: "the dispatch card visually privileged above the other five entry points"
      now: "equal weight, and the ask named as an ask"
    - was: "nothing on this site pointed anywhere for a reader in danger"
      now: "Resources.dc.html — crisis lines, coercive-control and shelter services, legal, immigration, housing, disability, 2SLGBTQ+, and Indigenous-led directories, each checked against the organisation's own site and dated. Ships as plain static HTML, no runtime, allowed to every crawler including the ones this site otherwise refuses training access to. Partial: the local/regional tier is not built yet, stated on the page rather than guessed at"
    - was: "a single safety-notice paragraph sat beside the Consent Domains Map, and the tool itself had no gate at all"
      now: "the tool sits behind a real sequence — five non-diagnostic safety questions, then optional rewritten grounding, then the tool — held in page state only, never stored or sent anywhere, with a Resources link at every step and no stage that can only be passed one way"
    - was: "principles 06 and 07 could conflict with no tiebreaker, leaving sovereignty language available to justify walking away from a dependant"
      now: "a Continuity of care clause on the Learn page — leaving is not abandonment, but it moves an unmet need rather than dissolving it; the clause is explicit that it is not available to anyone using it to keep a person who needs to leave"
    - was: "every reading page needed the runtime described below just to draw its text"
      now: "Manifesto is generated from plain data files by Hugo and committed as plain HTML — confirmed rendering with scripting off, not just claimed. Learn, Archive, and this page have not migrated yet; fault 4 stays open until they do"
    - was: "Learn's twelve principles, the opacity table, and the topics list lived in a JS array and needed scripting to draw"
      now: "Learn is generated by Hugo from plain YAML data files — confirmed rendering fully with scripting off. Archive and this page remain"
    - was: "this page (Behind the Scenes) needed the same runtime as every other reading page to draw its substrate, glyph, crawler, fault, and change-log tables"
      now: "generated by Hugo from six plain YAML data files, this page included — confirmed rendering fully with scripting off. Archive is the one reading page left; fault 4 stays open until it lands too"
    - was: "reading pages that need a runtime to draw"
      now: "plain HTML, generated once and committed; scripting is used only by the workshop (Practise) and, as a pure progressive enhancement, by Archive's filter-by-tag buttons — every one of Archive's 31 entries renders and reads with scripting off, unfiltered, confirmed against a real headless browser rather than assumed. Fault 4 retired"
    - was: "twelve principles written for a person who can choose, refuse, and exit a relationship — none for someone whose dependency is not chosen, and none for the person providing that care"
      now: "thirteen principles. Principle 03 revised (drops \"chosen,\" names guardianship, congregate care, and dependency that cannot be left); new principle 13, \"The carer is inside the relationship.\" The Consent Domains Map gains a matching Access Intimacy & Body Support domain — body support, administrative and logistical care, and emotional and relational care, each meant to be filled in from either position, sharing the map's existing five-option scale rather than a new one"
    - was: "no Content-Security-Policy anywhere, and two inline <script> blocks (the archive filter, the glyph check) that a strict one would have had to carve an exception for"
      now: "every page carries a CSP scoped to what that specific page actually does — no script execution at all on Resources, same-origin-only on the four reading pages and glyph-check, a narrow eval allowance only where the page template runtime still runs, connect-src naming the dispatch Worker only on the two pages that call it. Machine-enforced: a new CI check fails the build if any page ever loads a script, stylesheet, or CSS import/url() from off this domain. The two inline scripts were moved to their own files first, specifically so script-src never needed unsafe-inline anywhere. One real gap, disclosed rather than hidden: frame-ancestors can't be delivered via <meta> at all — a genuine CSP-specification limit, not a choice — so there is no clickjacking protection until this site moves off a host that can set response headers. Fault 06"
    - was: "the site's own 44-pixel touch-target standard held for the Consent Domains Map's radio controls but not for the primary or footer navigation, whose links were roughly 20 pixels tall everywhere; the Archive's Held in Common diagram had no way for a screen-reader user to know which visual column a list belonged to; Archive's 31 per-entry citation links (the page's actual purpose) were the same 20-pixel links as the nav"
      now: "every navigation link and every Archive citation link site-wide now meets 44 pixels, verified against real rendered layout at 320/375px, not just read off the markup. The three Held in Common lists carry aria-labelledby (or a visually-hidden label for the middle one, since it had no visible heading to point to) naming their category, verified by resolving the reference in a live DOM rather than assuming the markup was right — a first attempt (aria-label directly on a <ul>) failed html-validate's aria-label-misuse check, and the fix (a hidden label element plus aria-labelledby) was re-verified, not just applied. Keyboard focus order confirmed end to end on the Practise safety/grounding/tool sequence, including that the skip link genuinely lands the very next Tab on \"Continue\" — not just present, exercised. Honeypot field confirmed already correct (aria-hidden, tabindex=-1, autocomplete=off). This is the automatable half of RS-023: what a real screen reader (NVDA, JAWS, VoiceOver, TalkBack) actually announces has not been tested by a person and is not claimed here"
- version: "v0.1 — first draft"
  entries:
    - was: ""
      now: "Five pages: Home, Manifesto, Learn, Practise, Archive, Contribute. Twelve principles, fifteen theses, a working Consent Domains Map, a starter reading shelf."
