# "What this site refuses to the crawler" table on BehindTheScenes.dc.html.
- state: "indexed"
  what: "Manifesto, Learn, Archive, Behind the Scenes"
  why: "Public reading material. Find it, index it, pass it on. Refusing discovery for its own sake would just be obscurity."
  color: "#509C64"
- state: "disallowed"
  what: "Practise"
  why: "What a person marks about their own relationships is not material for a register, a snapshot, or a training set, even though nothing they type ever leaves their browser."
  color: "#DB9E2A"
- state: "disallowed"
  what: "Contribute"
  why: "Contributor material is reachable by relationship and request, governed by the terms each contributor chose, not by discovery."
  color: "#DB9E2A"
- state: "refused"
  what: "Training crawlers"
  why: "GPTBot, CCBot, Google-Extended, ClaudeBot and their kin are disallowed site-wide. This request has no technical force; it is stated so that ignoring it is a choice on the record."
  color: "#D07F75"
- state: "allowed, with limits"
  what: "Retrieval crawlers"
  why: "Training and retrieval are different acts. A crawler fetching this page to answer a person's question, and citing it back, may read the public pages. It is refused the workshop and the contribution page like anyone else. Refusing to become training data is not the same as refusing to be found."
  color: "#509C64"
