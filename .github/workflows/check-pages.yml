name: Check pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-and-a11y:
    runs-on: ubuntu-latest
    steps:
      # SEC-04.1: pinned to a 40-char commit SHA, not a mutable tag —
      # see deploy.yml's own comment on this for why. Dependabot
      # (.github/dependabot.yml) keeps the SHA and version comment
      # together current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Pinned exact version — see hugo/README.md for why (RS-004, D2:
      # Hugo is a single static binary, deliberately not an npm
      # dependency). This is what npm run check's Hugo-pages-in-sync
      # check needs to run for real here instead of soft-skipping.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Install Hugo v0.164.0
        run: |
          go install github.com/gohugoio/hugo@v0.164.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: HTML validation + accessibility (axe-core) check
        run: npm run check

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # The tests only use Node built-ins (no wrangler, no live accounts
      # needed) — wrangler in worker/package.json is for deploying, not
      # for testing.
      - name: Dispatch worker tests (crypto + full signup flow)
        run: npm test
        working-directory: worker
