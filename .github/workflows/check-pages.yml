name: Check pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-and-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: HTML validation + accessibility (axe-core) check
        run: npm run check
