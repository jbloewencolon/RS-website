name: Check pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-and-a11y:
    runs-on: ubuntu-latest
    steps:
      # SEC-04.1: pinned to a 40-char commit SHA, not a mutable tag —
      # see deploy.yml's own comment on this for why. Dependabot
      # (.github/dependabot.yml) keeps the SHA and version comment
      # together current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Pinned exact version — see hugo/README.md for why (RS-004, D2:
      # Hugo is a single static binary, deliberately not an npm
      # dependency). This is what npm run check's Hugo-pages-in-sync
      # check needs to run for real here instead of soft-skipping.
      #
      # Prebuilt binary, not `go install` (no actions/setup-go needed):
      # Hugo's own go.mod can (and did) bump its minimum Go version ahead
      # of whatever's pinned here, breaking this step on an otherwise-
      # unrelated upstream release — go install github.com/gohugoio/hugo@v0.164.0
      # started requiring Go >= 1.26 partway through this pin's life, with
      # the runner on 1.24. The prebuilt binary has no such second version
      # to track; hugo/README.md documents this as the other supported
      # install method for exactly this reason.
      - name: Install Hugo v0.164.0
        run: |
          curl -sSL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_0.164.0_linux-amd64.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: HTML validation + accessibility (axe-core) check
        run: npm run check

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # The tests only use Node built-ins (no wrangler, no live accounts
      # needed) — wrangler in worker/package.json is for deploying, not
      # for testing.
      - name: Dispatch worker tests (crypto + full signup flow)
        run: npm test
        working-directory: worker
