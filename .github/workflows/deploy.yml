name: Deploy to GitHub Pages

# Replaces the classic "Deploy from a branch" pipeline, which got stuck
# repeatedly (deployments stalling ~15 minutes then auto-cancelling,
# while ordinary Actions runs on this repo — see check-pages.yml —
# complete normally). This workflow uses the same, working runner pool,
# so it's not subject to whatever's wrong with that separate pipeline.
#
# One-time setup required: Settings → Pages → Build and deployment →
# Source → switch to "GitHub Actions". Nothing here takes effect until
# that's done.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # SEC-04.1: every `uses:` below is pinned to a 40-char commit SHA,
      # not a mutable tag — a compromised or repointed tag would otherwise
      # publish arbitrary content to the live domain via this workflow's
      # own pages:write/id-token:write permissions. The version comment is
      # what Dependabot (SEC-04.2, .github/dependabot.yml) reads to open a
      # PR bumping both the SHA and the comment when a new release ships;
      # don't let the two drift apart by hand-editing one without the other.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Renders each page in a headless browser and bakes the result into
      # the HTML, then assembles _site/. This is what makes the content
      # visible to readers with scripting off and to AI/search crawlers,
      # which parse the initial HTML and do not run JavaScript. It also
      # publishes only the actual site — not worker/ backend source or dev
      # tooling, which classic branch-deploy served as browsable files.
      - name: Prerender and assemble site
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # SEC-04.4. The audit's F-02: `cancel-in-progress: true` above means
      # a superseded run is killed mid-deploy, and a run that fails partway
      # can leave the previous artifact live with no signal anything's
      # wrong — the deploy step itself reporting success only means the
      # upload succeeded, not that the domain is actually serving it.
      # scripts/prerender.mjs stamps _site/deployed-commit.txt with
      # $GITHUB_SHA during the build above; this fetches that file back
      # through the URL Pages just reported and fails the run if it
      # doesn't match this run's own commit. Retries absorb ordinary CDN
      # propagation lag rather than racing it.
      - name: Verify the live domain is serving this commit
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          url="${base%/}/deployed-commit.txt"
          expected="${{ github.sha }}"
          for i in 1 2 3 4 5 6 7 8; do
            actual="$(curl -fsS "$url" 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "✓ $url is serving $expected"
              exit 0
            fi
            echo "Attempt $i/8: $url returned '$actual', expected '$expected' — retrying in 5s"
            sleep 5
          done
          echo "✗ $url never served the expected commit ($expected) after 8 attempts — the live domain may not reflect this deploy."
          exit 1
