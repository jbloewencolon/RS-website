name: Deploy to GitHub Pages

# Replaces the classic "Deploy from a branch" pipeline, which got stuck
# repeatedly (deployments stalling ~15 minutes then auto-cancelling,
# while ordinary Actions runs on this repo — see check-pages.yml —
# complete normally). This workflow uses the same, working runner pool,
# so it's not subject to whatever's wrong with that separate pipeline.
#
# One-time setup required: Settings → Pages → Build and deployment →
# Source → switch to "GitHub Actions". Nothing here takes effect until
# that's done.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Renders each page in a headless browser and bakes the result into
      # the HTML, then assembles _site/. This is what makes the content
      # visible to readers with scripting off and to AI/search crawlers,
      # which parse the initial HTML and do not run JavaScript. It also
      # publishes only the actual site — not worker/ backend source or dev
      # tooling, which classic branch-deploy served as browsable files.
      - name: Prerender and assemble site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
