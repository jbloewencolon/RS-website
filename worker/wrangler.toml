name = "rs-dispatch-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
SITE_URL = "https://relationalsovereignty.com"
WORKER_URL = "https://rs-dispatch-worker.rssite.workers.dev"
FROM_EMAIL = "dispatch@relationalsovereignty.com"

STORE_OWNER = "jbloewencolon"
STORE_REPO = "rs-dispatch-storage"
STORE_PATH = "subscribers.enc"
STORE_BRANCH = "main"

# Turnstile's site key is meant to be public — it's shipped to every
# browser that loads the form. Only the matching TURNSTILE_SECRET_KEY
# (below, via `wrangler secret put`) needs to stay private.
TURNSTILE_SITE_KEY = "0x4AAAAAAEMpChSeguKsGevc"

# Two jobs, one namespace, distinguished by key prefix — the per-IP,
# per-address, and daily-cap limits in src/ratelimit.js (`rl:...` keys,
# fail open if this binding is missing), and the short-lived pending-
# signup storage in src/pending.js (`signup:...` keys, REQUIRED — see
# that file for why the confirm token can no longer carry the payload
# itself). Create once with:
#   npx wrangler kv namespace create WORKER_KV
# then paste the id it prints below.
[[kv_namespaces]]
binding = "WORKER_KV"
id = "d42000356002e21893f25dde69c49a1b"
